apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kluge-runs
webhooks:
  - name: runs.kluge.dev
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: kluge-controller
        namespace: kluge
        path: /admit
      caBundle: {{ .Values.webhook.caBundle | quote }}
    rules:
      - apiGroups: ["kluge.dev"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["runs"]
