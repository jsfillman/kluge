apiVersion: v1
kind: ServiceAccount
metadata:
  name: kluge-controller
  namespace: kluge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kluge-researcher
  namespace: kluge
rules:
  - apiGroups: ["kluge.dev"]
    resources: ["runs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kluge-controller
  namespace: kluge
subjects:
  - kind: ServiceAccount
    name: kluge-controller
    namespace: kluge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kluge-controller-pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kluge-controller-pods
  namespace: kluge
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
