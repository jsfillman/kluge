[package]
name = "kluge-controller"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
kluge-check = { path = "../kluge-check" }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"

[[bin]]
name = "kluge-controller"
path = "src/main.rs"

[dev-dependencies]
rustls-pemfile = "2"
